# Publicação no Render (render.com): New → Blueprint → escolha o repositório.
# Banco: Neon (neon.tech) ou Supabase (veja HOSPEDAGEM.md); cole a connection string em DATABASE_URL quando o Render pedir.
services:
  - type: web
    name: mega-gestao
    runtime: node
    plan: starter            # sempre ligado (o plano free "dorme" depois de 15 min sem uso)
    region: virginia
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/me
    numInstances: 1          # o sistema foi feito para rodar em uma única instância
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
