<title>MEGA Gestão</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFC700">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MEGA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: dark fixed sidebar (workspace tree) + work area with view tabs, filter bar and a full-height view; task details open in a right drawer */
:root{
  --bg:#FBFAF6; --surface:#FFFFFF; --surface-2:#F4F3EC; --surface-3:#E9E7DC; --line:#E6E3D6;
  --fg:#121210; --muted:#5E5C53; --faint:#8F8C80;
  --accent:#12893F; --accent-2:#0D7333; --accent-fg:#FFFFFF; --accent-soft:#DCF2E3;
  --brand:#FFC700; --brand-2:#E8B400; --brand-fg:#121210; --brand-soft:#FFF4C7;
  --danger:#C23B22; --danger-soft:#FBE3DD; --warn:#A86400; --warn-soft:#FAEED6;
  --ok:#12893F; --ok-soft:#DCF2E3; --info:#2763B8; --info-soft:#E0E9F7;
  --side:#FFFFFF; --side-fg:#26251F; --side-muted:#7A776C; --side-hover:#F6F4EC; --side-active:#FFF4C7; --side-line:#ECE9DD;
  --shadow:0 1px 2px rgba(20,20,10,.06),0 6px 18px rgba(20,20,10,.07);
  --shadow-lg:0 12px 40px rgba(20,20,10,.2);
  --f-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px;
}
:root[data-theme="dark"]{
  --bg:#0E0E0C; --surface:#171714; --surface-2:#1F1F1B; --surface-3:#2A2924; --line:#302F28;
  --fg:#F2F0E6; --muted:#A4A193; --faint:#76736A;
  --accent:#3FD07A; --accent-2:#5EDB90; --accent-fg:#06200F; --accent-soft:#15301F;
  --brand:#FFD21F; --brand-2:#FFDD55; --brand-fg:#121210; --brand-soft:#3A3110;
  --danger:#F07A63; --danger-soft:#3B1E18; --warn:#E6AD48; --warn-soft:#382A13;
  --ok:#3FD07A; --ok-soft:#15301F; --info:#74A9F2; --info-soft:#172A44;
  --side:#050505; --side-fg:#E6E4DA; --side-muted:#85827A; --side-hover:#141412; --side-active:#1F1E19; --side-line:#191815;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); --shadow-lg:0 12px 40px rgba(0,0,0,.55);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:13px;height:13px}
.ic.rot{transform:rotate(90deg)}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* shell */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);height:100%}
#side{background:var(--side);color:var(--side-fg);box-shadow:1px 0 0 var(--side-line);display:flex;flex-direction:column;gap:4px;overflow-y:auto;padding:14px 10px 12px;border-right:1px solid var(--side-line)}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.scrim{display:none;position:fixed;inset:0;background:rgba(30,30,20,.2);z-index:35}

.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 10px;font-family:var(--f-display);font-size:21px;font-weight:700;color:var(--side-fg);letter-spacing:.02em}
.brand small{font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--side-muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--brand);display:grid;place-items:center;box-shadow:inset 0 -3px 0 var(--accent)}
.logo svg{width:20px;height:20px;stroke:var(--brand-fg);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.side-x{margin-left:auto;display:none;color:var(--side-muted)}
.sbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--side-hover);border:1px solid var(--side-line);color:var(--side-muted);margin-bottom:6px;text-align:left}
.sbar span{flex:1}
kbd{font-family:var(--f-mono);font-size:10.5px;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--side-muted);background:var(--surface)}
.nav{display:flex;flex-direction:column;gap:1px}
.nv{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--side-fg);text-align:left;width:100%;min-width:0}
.nv span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv:hover{background:var(--side-hover)}
.nv span.sq,.nv span.ld,.nv span.n{flex:none}
.nv.on{background:var(--side-active);color:var(--side-fg);font-weight:600;box-shadow:inset 3px 0 0 var(--brand-2)}
.nv .ic{color:var(--side-muted)}
.nv.on .ic{color:var(--accent)}
.badge{background:#E5533A;color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:0 6px;line-height:18px}
.sec{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 4px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);font-weight:600}
.sprow{padding:2px 4px 2px 2px;gap:2px}
.sprow .tw{padding:5px;border-radius:5px;color:var(--side-muted);display:flex}
.sprow .tw:hover{background:var(--side-line)}
.spname{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:4px;text-align:left}
.sq{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.lst{padding-left:40px;font-size:13.5px}
.ld{width:7px;height:7px;border-radius:2px;flex:none}
.lst .n{flex:none;color:var(--side-muted);font-size:11.5px;font-family:var(--f-mono)}
.side-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--side-line);display:flex;flex-direction:column;gap:1px}
.me{display:flex;align-items:center;gap:10px;padding:10px 8px 2px}
.me div{flex:1;min-width:0;display:flex;flex-direction:column}
.me b{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{color:var(--side-muted);font-size:11.5px}
#side .icon-btn{color:var(--side-muted)}
#side .icon-btn:hover{background:var(--side-hover);color:var(--side-fg)}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:16px 24px 10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.top-t{flex:1;min-width:0}
.top-t small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.top h1{font-size:24px;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis}
.top-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.menu{display:none}
.prog{display:inline-flex;align-items:center;gap:8px;margin-left:8px;vertical-align:middle}
.prog i{display:block;width:90px;height:5px;border-radius:9px;background:var(--surface-3);overflow:hidden}
.prog i b{display:block;height:100%;background:var(--ok)}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--danger)}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:7px;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn.sm{width:24px;height:24px}
input[type=text],input[type=password],input[type=url],input[type=number],input[type=date],input[type=time],input:not([type]),select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=color]{width:28px;height:28px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
textarea{resize:vertical}
.link{color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.link:hover{text-decoration:underline}
.muted{color:var(--muted)}
.count{color:var(--muted);font-size:12px;font-family:var(--f-mono)}

/* tabs + toolbar */
.tabs{display:flex;gap:2px;padding:0 24px;padding-left:max(24px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.tab{display:flex;align-items:center;gap:7px;padding:9px 12px;color:var(--muted);font-weight:600;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom:3px solid var(--brand)}
.tab.on .ic{color:var(--accent)}
.tb{display:flex;align-items:center;gap:8px;padding:10px 24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));flex-wrap:wrap;flex:none}
.tb select{font-size:13px;padding:5px 8px}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:0 9px;color:var(--muted);flex:0 1 240px;min-width:150px}
.search input{border:0;background:transparent;padding:6px 0;flex:1;box-shadow:none!important;color:var(--fg)}
.tog{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view>*{flex:1 1 auto;min-height:0}
.view>.g-ctl{flex:none}
.scroll{overflow:auto}
.page{flex:1;min-height:0;overflow:auto;padding:6px 24px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

/* shared bits */
.pill{--c:#8A94A0;display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:10px;font-weight:700;flex:none;border:2px solid var(--surface);letter-spacing:.02em}
.av.lg{width:40px;height:40px;font-size:14px}
.av.more{background:var(--surface-3);color:var(--muted)}
.avs{display:inline-flex}
.avs .av+.av{margin-left:-7px}
#side .av{border-color:var(--side)}
.due{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.due.late{color:var(--danger);font-weight:600}
.due.today{color:var(--warn);font-weight:600}
.pri{--c:var(--muted);display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--c);font-weight:600;white-space:nowrap}
.pri .ic{fill:var(--c)}
.tagc{--c:#888;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--fg);white-space:nowrap}
.tagc::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--c)}
.meta{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.crumb{font-size:11.5px;color:var(--faint);white-space:nowrap}
.sdot{width:9px;height:9px;border-radius:50%;flex:none}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:17px;margin-bottom:4px}

/* board (kanban) */
.board{display:flex;gap:12px;padding:6px 24px 24px;padding-left:max(24px,env(safe-area-inset-left,0px));height:100%;align-items:flex-start}
.col{flex:0 0 288px;background:var(--surface-2);border-radius:10px;display:flex;flex-direction:column;max-height:100%;border:1px solid transparent}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.col-est{margin-left:auto;font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.col-b{display:flex;flex-direction:column;gap:8px;padding:4px 8px;overflow-y:auto;min-height:20px}
.col-add{margin:6px 8px 10px;border-style:dashed!important;background:transparent!important;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.03);position:relative}
.card:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.card.dragging{opacity:.4}
.card .cover{height:6px;border-radius:4px;margin:-3px -4px 0}
.card-title{font-weight:600;line-height:1.35;display:flex;gap:6px;align-items:flex-start;overflow-wrap:anywhere}
.card-title .ic{margin-top:2px;color:var(--danger)}
.card-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-row .avs{margin-left:auto}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.done-t{text-decoration:line-through;color:var(--muted)}

/* list view */
.lv{padding:4px 24px 30px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));height:100%}
.lg{margin-bottom:18px}
.lg-h{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;user-select:none}
.lg-rows{background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lrow{display:grid;grid-template-columns:30px minmax(0,1fr) 110px 100px 100px;align-items:center;gap:10px;padding:7px 12px;border-top:1px solid var(--line);cursor:pointer;min-height:42px}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--surface-2)}
.lrow.lhead{cursor:default;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;min-height:32px;background:var(--surface)}
.lrow.add{cursor:text;color:var(--muted)}
.lrow.add input{border:0;background:transparent;padding:4px 0;box-shadow:none!important;grid-column:2/-1}
.lt{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.lt .ttl{font-weight:500;overflow-wrap:anywhere;display:inline-flex;gap:5px;align-items:center}
.lt .ttl .ic{color:var(--danger)}
.chk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;color:transparent}
.chk .ic{width:12px;height:12px;stroke-width:3}
.chk:hover{border-color:var(--ok);color:var(--ok)}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}

/* table view */
.tblw{padding:4px 24px 30px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
table.tt{border-collapse:separate;border-spacing:0;width:100%;min-width:1080px;background:var(--surface);border:1px solid var(--line);border-radius:9px;font-size:13px}
.tt th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;z-index:1}
.tt th:first-child{border-top-left-radius:9px}.tt th:last-child{border-top-right-radius:9px}
.tt td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tt tr:last-child td{border-bottom:0}
.tt tr:hover td{background:var(--surface-2)}
.tt td select,.tt td input{font-size:12.5px;padding:3px 6px;border-color:transparent;background:transparent}
.tt td select:hover,.tt td input:hover{border-color:var(--line)}
.tt .tcell{font-weight:600;cursor:pointer;max-width:320px}
.tt .tcell:hover{color:var(--accent)}

/* calendar */
.calw{display:flex;gap:14px;padding:4px 24px 24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));height:100%;min-height:0}
.cal{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-h h2{font-size:18px;min-width:170px}
.cal-g{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:auto;grid-auto-rows:minmax(104px,1fr);border:1px solid var(--line);border-radius:10px;overflow:auto;background:var(--line);gap:1px}
.cal-dow{background:var(--surface-2);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;position:sticky;top:0;z-index:1}
.cal-dow-row{display:contents}
.cday{background:var(--surface);padding:5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;min-height:0;overflow:hidden}
.cday.out{background:var(--surface-2)}
.cday.out .dn{color:var(--faint)}
.cday.over{background:var(--accent-soft)}
.cday-h{display:flex;align-items:center;justify-content:space-between}
.dn{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cday.td .dn{background:var(--brand);color:var(--brand-fg);border-radius:99px;padding:0 7px;font-weight:600}
.cday .addd{opacity:0}
.cday:hover .addd{opacity:1}
.cchips{display:flex;flex-direction:column;gap:3px;overflow-y:auto;min-height:0}
.cchip{--c:#888;font-size:12px;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 16%,var(--surface));border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;flex:none}
.cchip.dn-t{opacity:.55;text-decoration:line-through}
.tray{flex:0 0 220px;background:var(--surface-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;border:1px solid transparent}
.tray.over{border-color:var(--accent)}
.tray h3{font-size:13px;font-family:var(--f-body);font-weight:700}
.tray p{margin:0 0 4px;font-size:12px;color:var(--muted)}

/* gantt */
.gw{margin:0 24px 20px;margin-left:max(24px,env(safe-area-inset-left,0px));border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.g-ctl{display:flex;align-items:center;gap:8px;padding:2px 24px 10px;padding-left:max(24px,env(safe-area-inset-left,0px))}
.g{position:relative}
.g-head{display:flex;position:sticky;top:0;z-index:3;background:var(--surface-2);border-bottom:1px solid var(--line)}
.g-name{flex:0 0 230px;position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);padding:0 10px;display:flex;align-items:center;gap:7px;min-width:0;font-size:13px}
.g-head .g-name{background:var(--surface-2);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.g-days{display:flex}
.g-day{flex:0 0 var(--dw);text-align:center;font-size:10.5px;color:var(--muted);padding:4px 0;font-family:var(--f-mono);line-height:1.25;border-left:1px solid var(--line)}
.g-day b{display:block;font-size:12px;color:var(--fg);font-weight:500}
.g-day.we{background:color-mix(in srgb,var(--surface-3) 60%,transparent)}
.g-day.td b{color:var(--accent);font-weight:700}
.g-day.m1{border-left:2px solid var(--faint)}
.g-grid{position:absolute;top:0;bottom:0;display:flex;pointer-events:none}
.g-grid span{flex:0 0 var(--dw);border-left:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.g-grid span.we{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.g-grid span.td{background:color-mix(in srgb,var(--accent) 10%,transparent);border-left:2px solid var(--accent)}
.g-row{display:flex;height:38px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.g-row .g-name{cursor:pointer}
.g-row .g-name:hover{color:var(--accent)}
.g-row .g-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-track{position:relative;flex:none}
.bar{--c:#3B82F6;position:absolute;top:7px;height:24px;border-radius:6px;background:color-mix(in srgb,var(--c) 26%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 70%,transparent);font-size:11.5px;font-weight:600;padding:0 8px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;cursor:grab;touch-action:none;user-select:none}
.bar .pf{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--c) 30%,transparent);pointer-events:none}
.bar span{position:relative}
.bar .h{position:absolute;right:0;top:0;bottom:0;width:9px;cursor:ew-resize}
.bar.done{opacity:.6}
.bar.late{border-color:var(--danger);border-width:2px}

/* workload */
.lw{padding:4px 24px 30px;padding-left:max(24px,env(safe-area-inset-left,0px));height:100%}
.ld-t{display:grid;grid-template-columns:200px repeat(5,minmax(150px,1fr));min-width:960px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ld-t>div{padding:10px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);min-width:0}
.ld-t>.lh{background:var(--surface-2);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ld-m{display:flex;align-items:center;gap:9px;border-left:0!important}
.ld-m b{display:block;font-size:13px}
.ld-m small{color:var(--muted);font-size:11.5px}
.meter{height:7px;border-radius:9px;background:var(--surface-3);overflow:hidden;margin:4px 0 6px}
.meter i{display:block;height:100%;border-radius:9px}
.ld-c .hrs{font-family:var(--f-mono);font-size:12px}
.ld-c .lk{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:left;width:100%}
.ld-c .lk:hover{color:var(--accent)}

/* page blocks */
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel>h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel>h2 .count{margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:12px;padding:14px 16px}
.kpi small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-family:var(--f-display);font-size:30px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.bad b{color:var(--danger)}
.kpi.good b{color:var(--ok)}
.kpi span{font-size:12px;color:var(--muted)}
.mini{display:flex;align-items:center;gap:9px;padding:7px 4px;border-top:1px solid var(--line);cursor:pointer}
.mini:first-of-type{border-top:0}
.mini:hover .mt{color:var(--accent)}
.mini .mt{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:14px 0 4px;display:flex;gap:6px;align-items:center}
.grp-l:first-child{margin-top:0}
.grp-l.bad{color:var(--danger)}
.act{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.act:first-of-type{border-top:0}
.act p{margin:0;min-width:0;overflow-wrap:anywhere}
.act small{color:var(--faint);display:block}
.act .tl{color:var(--accent);font-weight:600;cursor:pointer}

/* charts */
.hbar{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;align-items:center;gap:10px;padding:5px 0;font-size:13px}
.hbar .tr{height:12px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:flex}
.hbar .tr i{display:block;height:100%}
.hbar .v{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--muted)}
.hbar .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.stack{display:flex;height:14px;border-radius:5px;overflow:hidden;background:var(--surface-2);margin:2px 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;border-bottom:1px solid var(--line);position:relative;padding-top:18px}
.cols .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:10px;color:var(--faint);font-family:var(--f-mono)}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.cols .c i{flex:none;display:block;width:100%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.cols .c i.z{background:var(--surface-3)}
.cols .c em{flex:none;font-style:normal;font-size:10.5px;line-height:14px;margin-bottom:2px;font-family:var(--f-mono);color:var(--fg)}
.cols-x{display:flex;gap:6px;margin-top:4px}
.cols-x span{flex:1;text-align:center;font-size:10px;color:var(--muted);font-family:var(--f-mono)}
.cols-x span.td{color:var(--accent);font-weight:700}

/* goals */
.goal{display:flex;flex-direction:column;gap:12px}
.goal-h{display:flex;align-items:flex-start;gap:10px}
.goal-h h3{font-size:17px;flex:1}
.ring{--p:0;--c:var(--accent);width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center;flex:none}
.ring b{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px}
.tgt{display:flex;flex-direction:column;gap:5px;padding:9px 0;border-top:1px solid var(--line)}
.tgt-h{display:flex;align-items:center;gap:8px;font-size:13px}
.tgt-h b{flex:1;font-weight:600}
.tgt-v{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.tgt-v input{width:110px;font-size:12.5px;padding:3px 6px}

/* automations */
.rule{display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.rule .ri{width:34px;height:34px;border-radius:8px;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;flex:none}
.rule.off .ri{background:var(--surface-2);color:var(--faint)}
.rule.off .rs{opacity:.6}
.rs{flex:1;min-width:0}
.rs b{font-weight:600}
.rs p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.rs .k{display:inline-block;background:var(--surface-2);border-radius:5px;padding:0 6px;color:var(--fg);font-weight:600;margin:1px 0}
.sw{position:relative;width:36px;height:20px;border-radius:99px;background:var(--surface-3);flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.sw.on{background:var(--accent)}
.sw.on::after{left:18px}
.builder{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13.5px}
.builder .w{font-weight:700;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.08em}
.stack-v{display:flex;flex-direction:column;gap:10px}
.sug{display:flex;flex-wrap:wrap;gap:8px}
.sug button{border:1px dashed var(--line);border-radius:8px;padding:7px 11px;font-size:12.5px;text-align:left;background:var(--surface)}
.sug button:hover{border-color:var(--accent);color:var(--accent)}

/* docs */
.docs{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;height:100%;min-height:420px}
.doclist{display:flex;flex-direction:column;gap:2px}
.docitem{display:flex;flex-direction:column;align-items:flex-start;padding:9px 10px;border-radius:8px;text-align:left;width:100%}
.docitem:hover{background:var(--surface-2)}
.docitem.on{background:var(--accent-soft)}
.docitem b{font-weight:600;font-size:13.5px}
.docitem small{font-size:11.5px;color:var(--muted)}
.doced{display:flex;flex-direction:column;gap:10px;min-width:0}
.doced .dt{font-family:var(--f-display);font-size:26px;font-weight:700;border:0;background:transparent;padding:4px 0}
.doced .dt:focus{box-shadow:none}
.doced textarea{min-height:420px;line-height:1.65;font-size:15px;padding:14px 16px;max-width:780px}

/* team */
.mcard{display:flex;flex-direction:column;gap:10px}
.mcard-h{display:flex;gap:12px;align-items:center}
.mcard-h div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mcard-h input{font-weight:600;padding:3px 6px}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.mstats div{background:var(--surface-2);border-radius:8px;padding:7px 4px}
.mstats b{display:block;font-family:var(--f-mono);font-size:16px}
.mstats small{font-size:11px;color:var(--muted)}
.youtag{font-size:10.5px;font-weight:700;background:var(--brand);color:var(--brand-fg);border-radius:5px;padding:1px 6px;letter-spacing:.04em;text-transform:uppercase}

/* settings */
.set-sec{margin-bottom:22px}
.set-sec>h2{font-size:18px;margin-bottom:4px}
.set-sec>p{margin:0 0 12px;color:var(--muted)}
.strow{display:flex;align-items:center;gap:8px;padding:5px 0;flex-wrap:wrap}
.strow input[type=text]{flex:1;min-width:120px}
.sp-set{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.sp-set:first-of-type{border-top:0;margin-top:0;padding-top:0}
.sp-set h3{font-size:12px;font-family:var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
.io{width:100%;min-height:120px;font-family:var(--f-mono);font-size:11.5px}

/* inbox */
.notif{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.notif:first-of-type{border-top:0}
.notif:hover{background:var(--surface-2)}
.notif .ud{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}
.notif .ud.r{background:transparent}
.notif p{margin:0;flex:1;min-width:0}
.notif small{color:var(--faint)}

/* drawer */
#drawer{position:fixed;inset:0;z-index:30}
.dr-back{position:absolute;inset:0;background:rgba(30,30,20,.16)}
.dr{position:absolute;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.6}}
.dr-h{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.dr-h .crumbs{flex:1;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.dr-h .crumbs select{border-color:transparent;background:transparent;font-size:13px;max-width:100%;min-width:0;padding:3px 4px}
.dr-h .crumbs select:hover{border-color:var(--line)}
.dr-act{display:flex;gap:4px;align-items:center}
.dr-b{flex:1;padding:16px 24px 40px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.dr-status{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status-sel{--c:#888;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;background:color-mix(in srgb,var(--c) 16%,var(--surface))!important;border-color:color-mix(in srgb,var(--c) 45%,transparent)!important}
.dr-title{font-family:var(--f-display);font-size:24px;font-weight:700;border:0!important;background:transparent!important;padding:2px 0!important;resize:none;line-height:1.25;field-sizing:content;box-shadow:none!important;width:100%}
.warnbox{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:8px;background:var(--danger-soft);color:var(--danger);font-size:13px;font-weight:500}
.props{display:grid;grid-template-columns:140px minmax(0,1fr);gap:4px 12px;align-items:center}
.props>label{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:7px;min-height:34px}
.props>div{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:34px;min-width:0}
.props select,.props input{font-size:13px;padding:4px 7px}
.atog{opacity:.32;filter:grayscale(.6);transition:opacity .1s}
.atog:hover{opacity:.7}
.atog.on{opacity:1;filter:none}
.ttog{opacity:.45;cursor:pointer;border:1px dashed transparent}
.ttog.on{opacity:1}
.ttog:hover{border-color:var(--line)}
.dchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--surface-2);border-radius:6px;padding:2px 4px 2px 8px;max-width:100%}
.dchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.dchip.open{background:var(--danger-soft);color:var(--danger)}
.dr-b h3{font-size:14px;font-family:var(--f-body);font-weight:700;display:flex;align-items:center;gap:8px;margin-top:6px}
.desc{min-height:110px;width:100%;line-height:1.55}
.sublist,.cklist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.subrow,.ckrow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-top:1px solid var(--line);min-height:38px}
.subrow:first-child,.ckrow:first-child{border-top:0}
.subrow .st{flex:1;min-width:0;cursor:pointer;font-weight:500;overflow-wrap:anywhere}
.subrow .st:hover{color:var(--accent)}
.ckrow span{flex:1;min-width:0;overflow-wrap:anywhere}
.ckrow .icon-btn{opacity:0}
.ckrow:hover .icon-btn{opacity:1}
.addrow{border:0!important;border-top:1px solid var(--line)!important;border-radius:0!important;padding:9px 12px!important;background:transparent!important;box-shadow:none!important}
.sublist .addrow:first-child,.cklist .addrow:first-child{border-top:0!important}
.ckbar{height:6px;background:var(--surface-3);border-radius:9px;overflow:hidden;flex:1;max-width:200px}
.ckbar i{display:block;height:100%;background:var(--ok)}
.feed{display:flex;flex-direction:column;gap:10px}
.cm{display:flex;gap:10px}
.cm .bx{flex:1;min-width:0;background:var(--surface-2);border-radius:10px;padding:8px 12px}
.cm .bx p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cm .bx small{color:var(--faint);font-size:11.5px}
.mention{color:var(--accent);font-weight:600}
.lg-a{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;padding-left:6px}
.lg-a::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--faint);flex:none}
.lg-a small{color:var(--faint);margin-left:auto;white-space:nowrap}
.cbox{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.cbox textarea{width:100%;min-height:70px}
.auto-av{background:var(--warn)!important}

/* timer pill */
.timer-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:99px;background:var(--danger-soft);color:var(--danger);font-weight:600;font-size:12.5px;max-width:260px}
.timer-pill .tp-t{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer-pill [data-tick]{font-family:var(--f-mono)}

/* modal, toast */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:start center;padding:10vh 16px 16px;background:rgba(30,30,20,.22);overflow-y:auto}
.md{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:min(520px,100%);padding:20px;display:flex;flex-direction:column;gap:14px;animation:pop .14s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:.5}}
.md h2{font-size:19px}
.md .f{display:flex;flex-direction:column;gap:5px}
.md .f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.md .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.md .foot{display:flex;justify-content:flex-end;gap:8px}
.md p{margin:0;color:var(--muted)}
.pal{padding:0;gap:0;overflow:hidden;width:min(600px,100%)}
.pal .pin{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--muted)}
.pal .pin input{flex:1;border:0;padding:4px 0;font-size:16px;box-shadow:none!important;background:transparent}
#palres{max-height:52vh;overflow-y:auto;padding:6px}
.pr{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;width:100%;text-align:left}
.pr:hover,.pr.sel{background:var(--surface-2)}
.pr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr small{color:var(--faint);font-size:11.5px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:9px;font-weight:600;font-size:13px;z-index:60;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px)}
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl label{border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;font-size:13px}
.tpl label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.tpl small{display:block;color:var(--muted);font-size:11.5px}

/* login, usuários e permissões */
#auth{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto}
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.auth-side{background:var(--brand-soft);color:var(--fg);padding:48px 40px;padding-left:max(40px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:28px;justify-content:center;position:relative;overflow:hidden}
.auth-side::before{content:"";position:absolute;right:-90px;bottom:-90px;width:280px;height:280px;border-radius:50%;border:30px solid var(--brand)}
.auth-side::after{content:"";position:absolute;right:120px;bottom:-40px;width:90px;height:90px;border-radius:50%;background:var(--accent)}
.auth-brand{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--fg);letter-spacing:.02em}
.auth-brand small{font-family:var(--f-body);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:6px}
.auth-side h2{font-size:34px;line-height:1.1;color:var(--fg);max-width:15ch;position:relative;z-index:1}
.auth-side ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.auth-side li{display:flex;gap:10px;align-items:center}
.auth-side li .ic{color:var(--accent)}
.auth-main{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
.auth-form{width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.auth-form h1{font-size:28px}
.auth-form p{margin:0}
.auth-form .f{display:flex;flex-direction:column;gap:5px}

/* ============ produtora de vídeo ============ */

const GEAR_CATS=[['camera','Câmeras'],['lente','Lentes'],['drone','Drones'],['audio','Áudio'],['luz','Iluminação'],['estab','Estabilização e suporte'],['outro','Outros']];

const shootRange=l=>l&&l.shootStart?[l.shootStart,l.shootEnd&&l.shootEnd>l.shootStart?l.shootEnd:l.shootStart]:null;
const overlap=(a,b)=>!!(a&&b&&a[0]<=b[1]&&b[0]<=a[1]);
const shootDays=l=>{const r=shootRange(l);return r?diffDays(r[0],r[1])+1:0};
/* outros projetos que usam o mesmo recurso (gear = equipamento, freelas = freelancer) em datas que se cruzam */
const clashes=(field,id,l)=>{const r=shootRange(l);return r?S.lists.filter(o=>o.id!==l.id&&(o[field]||[]).includes(id)&&overlap(r,shootRange(o))):[]};
const usingOn=(field,id,d)=>S.lists.filter(l=>(l[field]||[]).includes(id)&&overlap(shootRange(l),[d,d]));
const nextUses=(field,id)=>S.lists.filter(l=>(l[field]||[]).includes(id)&&shootRange(l)&&shootRange(l)[1]>=TODAY).sort((a,b)=>a.shootStart.localeCompare(b.shootStart));

function jobTaskDefs(l,kind,members){
  const shoot=l.shootStart||(l.due?addDays(l.due,-21):addDays(TODAY,14)),due=l.due&&l.due>shoot?l.due:addDays(shoot,30);
  const team=(l.team||[]).map(id=>members.find(m=>m.id===id)).filter(Boolean);
  const by=fn=>team.filter(m=>m.funcao===fn).map(m=>m.id);
  return (JOB_TPL[kind]||JOB_TPL.outro).map(([title,anchor,off,fn,priority,estimate,ck])=>{
    let as=fn==='filmmaker'?by('filmmaker'):by(fn).slice(0,1);
    if(!as.length&&(fn==='gestao'||fn==='producao'))as=by(fn==='gestao'?'producao':'gestao').slice(0,1);
    if(!as.length&&(fn==='gestao'||fn==='producao')&&l.owner)as=[l.owner];
    const date=addDays(anchor==='shoot'?shoot:due,off);
    const multi=anchor==='shoot'&&off===0&&l.shootEnd&&l.shootEnd>shoot;
    return {title,start:date,due:multi?l.shootEnd:date,fn,priority,estimate,assignees:as,checklist:(ck||[]).map(x=>({id:uid(),text:x,done:false}))};

async function sha(str){
  if(window.crypto?.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')}
  let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16);
}
const rnd=()=>Array.from(crypto.getRandomValues(new Uint8Array(24)),b=>b.toString(16).padStart(2,'0')).join('');

const LocalAPI={
  KEY:'mega-demo-db-v4',TK:'mega-demo-sid-v4',db:null,mem:{},h:null,
  get(k){try{return localStorage.getItem(k)}catch(e){return this.mem[k]??null}},
  set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){this.mem[k]=v}},
  async call(method,path,body){
    if(!this.db){try{this.db=JSON.parse(this.get(this.KEY))}catch(e){}if(!this.db)this.db=MegaCore.emptyDb()}
    if(!this.h)this.h=MegaCore.createApi({hash:async p=>{const salt=rnd().slice(0,12);return salt+'$'+await sha(salt+p)},verify:async(p,h)=>{if(!h)return false;const [salt,d]=h.split('$');return await sha(salt+p)===d},token:rnd});
    const r=await this.h(this.db,this.get(this.TK),method,path,body?clone(body):{});
    if(r.setToken)this.set(this.TK,r.setToken);
    if(r.clearToken)this.set(this.TK,null);
    if(method!=='GET')this.set(this.KEY,JSON.stringify(this.db));
    return {status:r.status,json:clone(r.json)};
  }
};
async function api(method,path,body){
  if(MODE==='local')return LocalAPI.call(method,path,body);
  try{
    const r=await fetch(path.slice(1),{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
    let j={};try{j=await r.json()}catch(e){}
    return {status:r.status,json:j};
  }catch(e){return {status:0,json:{error:'Sem conexão com o servidor. Verifique a internet e tente de novo.'}}}
}
async function detectMode(){
  if(location.protocol.startsWith('http')){
    try{const r=await fetch('api/me',{credentials:'same-origin',cache:'no-store'});if(r.ok){const j=await r.json();if(j&&'setup' in j){MODE='remote';try{localStorage.setItem('mega-remote','1')}catch(e){}return j}}}
    catch(e){let was=false;try{was=!!localStorage.getItem('mega-remote')}catch(x){}if(was){MODE='remote';return {offline:true}}}
  }
  MODE='local';return (await LocalAPI.call('GET','/api/me')).json;
}
function diffState(a,b){
  const up={},del={};let n=0;
  COLS.forEach(c=>{
    const bm=new Map((b[c]||[]).map(x=>[x.id,JSON.stringify(x)])),seen=new Set();
    (a[c]||[]).forEach(x=>{seen.add(x.id);if(bm.get(x.id)!==JSON.stringify(x)){(up[c]=up[c]||[]).push(x);n++}});
    bm.forEach((v,id)=>{if(!seen.has(id)){(del[c]=del[c]||[]).push(id);n++}});
  });
  return n?{upserts:up,deletes:del}:null;
}
function applyDiff(st,d){
  Object.entries(d.upserts).forEach(([c,xs])=>xs.forEach(x=>{const i=st[c].findIndex(y=>y.id===x.id);if(i<0)st[c].push(x);else st[c][i]=x}));
  Object.entries(d.deletes).forEach(([c,ids])=>{st[c]=st[c].filter(y=>!ids.includes(y.id))});
}
let syncing=false,syncAgain=false,syncT=null,pendingRender=false,netDown=false;

function isTyping(){const a=document.activeElement;return !!a&&a.matches('textarea,input:not([type=checkbox]):not([type=radio]):not([type=color]),select')&&!a.closest('#modal,#auth')}
async function sync(force){
  if(!ME||!SNAP)return;
  if(syncing){syncAgain=syncAgain||'x';if(force)syncAgain='force';return}
  const sent=clone(pick(S)),changes=diffState(sent,SNAP);
  if(!changes&&!force)return;
  syncing=true;
  try{
    const r=await api('POST','/api/sync',{version:VERSION,changes});
    if(r.status===401){resetSession();showAuth('login',r.json.error);return}
    if(r.status!==200){if(!netDown)toast(r.json.error||'Não foi possível salvar. Vou tentar de novo em instantes.');netDown=true;return}
    if(netDown){netDown=false;toast('Conexão restabelecida. Alterações salvas.')}
    if(r.json.same)return;
    const late=diffState(pick(S),sent);
    SNAP=clone(pick(r.json.state));VERSION=r.json.version;
    const base=clone(r.json.state);if(late)applyDiff(base,late);
    COLS.forEach(c=>S[c]=base[c]);S.members=r.json.state.members;
    ME=r.json.user;S.me=ME.id;
    if(r.json.denied&&r.json.denied.length)toast(r.json.denied[0]);
    if(isTyping())pendingRender=true;else render();
  }finally{
    syncing=false;
    if(syncAgain){const f=syncAgain==='force';syncAgain=false;sync(f)}
  }
}

const chatUnreadTotal=()=>CHAT.convs.reduce((a,c)=>a+convUnread(c),0);
const hhmm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const chatTime=ts=>{const d=iso(new Date(ts));return d===TODAY?hhmm(ts):d===addDays(TODAY,-1)?'Ontem':fmtDate(d)};
const linkify=t=>esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
let chatBusy=false;
async function chatPoll(){
  if(!ME||chatBusy)return;chatBusy=true;
  try{
    const r=await api('POST','/api/chat/poll',{ver:CHAT.ver,since:CHAT.since});
    if(r.status!==200||r.json.same)return;
    const j=r.json,first=!CHAT.loaded,incoming=[];
    CHAT.convs=j.convs;
    Object.entries(j.reads||{}).forEach(([k,v])=>CHAT.reads[k]=Math.max(CHAT.reads[k]||0,v));
    j.msgs.forEach(m=>{const l=CHAT.msgs[m.convId]=CHAT.msgs[m.convId]||[];const i=l.findIndex(x=>x.id===m.id);if(i>=0)l[i]=m;else{l.push(m);if(!first&&m.from!==S.me&&!m.deleted)incoming.push(m)}});
    Object.values(CHAT.msgs).forEach(l=>l.sort((a,b)=>a.at-b.at));
    if(first)CHAT.convs.forEach(c=>CHAT.more[c.id]=(CHAT.msgs[c.id]||[]).length>=150);
    CHAT.ver=j.ver;CHAT.since=j.now;CHAT.loaded=true;
    chatAfterUpdate(incoming,first);
  }finally{chatBusy=false}
}
function chatMarkRead(c){
  const last=(CHAT.msgs[c.id]||[]).at(-1);
  if(!last||(CHAT.reads[c.id]||0)>=last.at)return;
  CHAT.reads[c.id]=last.at;api('POST','/api/chat/read',{convId:c.id,at:last.at});
}

function chatMsgsInner(c){
  const msgs=c?(CHAT.msgs[c.id]||[]):[];
  if(!msgs.length)return `<div class="cm-empty"><b>Nenhuma mensagem ainda</b>Escreva abaixo para começar a conversa.</div>`;
  let out=c&&CHAT.more[c.id]?'<button class="btn ghost sm" data-a="chatMore">Carregar mensagens anteriores</button>':'',lastDay='',prev=null;
  msgs.forEach(m=>{
    const d=iso(new Date(m.at));
    if(d!==lastDay){out+=`<div class="cm-day"><span>${d===TODAY?'Hoje':d===addDays(TODAY,-1)?'Ontem':fmtLong(d)}</span></div>`;lastDay=d;prev=null}
    const mine=m.from===S.me,cont=prev&&prev.from===m.from&&m.at-prev.at<5*60e3;
    out+=`<div class="cm ${mine?'me':''} ${cont?'cont':''}">${!mine&&!cont?(mem(m.from)?av(m.from):'<span class="av more">?</span>'):'<span class="cm-sp"></span>'}<div class="cm-b">${!mine&&!cont?`<small class="cm-n">${esc(mem(m.from)?.name||'Usuário removido')}</small>`:''}<div class="cm-t ${m.deleted?'del':''}">${m.deleted?'Mensagem apagada':linkify(m.text)}</div><span class="cm-time">${hhmm(m.at)}${mine&&!m.deleted?`<button class="cm-x" data-a="chatDel" data-id="${m.id}" title="Apagar mensagem" aria-label="Apagar mensagem">${ic('trash','sm')}</button>`:''}</span></div></div>`;
    prev=m;

}

const mem=id=>S.members.find(m=>m.id===id);
const listById=id=>S.lists.find(l=>l.id===id);
const spaceById=id=>S.spaces.find(s=>s.id===id);
const taskById=id=>S.tasks.find(t=>t.id===id);
const tagById=id=>S.tags.find(x=>x.id===id);
const spaceOf=t=>spaceById(listById(t.listId)?.spaceId);
const statusOf=t=>{const sp=spaceOf(t);return sp?.statuses.find(s=>s.id===t.status)||sp?.statuses[0]};
const isDone=t=>!!statusOf(t)?.done;
const isLate=t=>!!t.due&&!isDone(t)&&t.due<TODAY;
const spent=t=>t.time.reduce((a,e)=>a+e.min,0);
const blocked=t=>t.blockedBy.some(id=>{const b=taskById(id);return b&&!isDone(b)});
const statusByName=(sp,n)=>sp?.statuses.find(s=>s.name===n);
const actor=()=>AUTO?'auto':S.me;
let AUTO=null,DEPTH=0;

/* ============ componentes ============ */
const initials=n=>String(n).split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function av(id,cls=''){if(id==='auto')return `<span class="av auto-av ${cls}" title="Automação">${ic('zap','sm')}</span>`;const m=mem(id);if(!m)return'';return `<span class="av ${cls}" style="background:${m.color}" title="${esc(m.name)}">${initials(m.name)}</span>`}
const avs=ids=>`<span class="avs">${ids.slice(0,3).map(i=>av(i)).join('')}${ids.length>3?`<span class="av more">+${ids.length-3}</span>`:''}</span>`;
const pill=(name,color)=>`<span class="pill" style="--c:${color}">${esc(name)}</span>`;
const priChip=(p,short)=>p&&PRI[p]?`<span class="pri" style="--c:${PRI[p].c}" title="Prioridade ${PRI[p].l}">${ic('flag','sm')}${short?'':PRI[p].l}</span>`:'';
function dueChip(t){if(!t.due)return'';const c=isDone(t)?'':isLate(t)?'late':t.due===TODAY?'today':'';return `<span class="due ${c}" title="Prazo: ${fmtLong(t.due)}">${ic('cal','sm')}${fmtDate(t.due)}</span>`}
const tagChips=t=>t.tags.map(tagById).filter(Boolean).map(g=>`<span class="tagc" style="--c:${g.color}">${esc(g.name)}</span>`).join('');
function badges(t){
  const subs=S.tasks.filter(x=>x.parentId===t.id),out=[];
  if(subs.length)out.push(`<span class="meta" title="Subtarefas">${ic('sub','sm')}${subs.filter(isDone).length}/${subs.length}</span>`);
  if(t.checklist.length)out.push(`<span class="meta" title="Checklist">${ic('checks','sm')}${t.checklist.filter(c=>c.done).length}/${t.checklist.length}</span>`);
  if(t.comments.length)out.push(`<span class="meta" title="Comentários">${ic('msg','sm')}${t.comments.length}</span>`);
  if(t.rev)out.push(`<span class="meta" title="Rodadas de revisão do cliente" style="font-weight:700">R${t.rev}</span>`);
  if(safeUrl(t.link))out.push(`<span class="meta" title="Tem link">${ic('link','sm')}</span>`);
  if(t.recur)out.push(`<span class="meta" title="Recorrente">${ic('repeat','sm')}</span>`);
  if(S.timer?.taskId===t.id)out.push(`<span class="meta" style="color:var(--danger)" title="Cronômetro rodando">${ic('clock','sm')}</span>`);
  return out.join('');
}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
const logoSVG='<svg viewBox="0 0 24 24"><path d="M4 19V5l8 9 8-9v14"/></svg>';

/* ============ mutações ============ */
function log(t,text){t.activity.push({at:Date.now(),by:actor(),text})}
function notify(to,text,taskId,force){if(!to||(!force&&to===S.me))return;S.notifs.unshift({id:uid(),to,text,taskId,at:Date.now(),read:false})}
const who=()=>AUTO?`Automação “${AUTO}”`:mem(S.me)?.name||'Alguém';
function describe(f,o,v,t){
  const sp=spaceOf(t);
  switch(f){
    case 'status':return `mudou o status de ${sp?.statuses.find(s=>s.id===o)?.name||'?'} para ${statusOf(t)?.name}`;
    case 'priority':return `definiu a prioridade como ${PRI[v]?.l}`;
    case 'due':return v?`definiu o prazo para ${fmtLong(v)}`:'removeu o prazo';
    case 'start':return v?`definiu o início para ${fmtLong(v)}`:'removeu a data de início';
    case 'assignees':{const a=v.filter(x=>!o.includes(x)).map(x=>mem(x)?.name),r=o.filter(x=>!v.includes(x)).map(x=>mem(x)?.name);return [a.length?`adicionou ${a.join(', ')} aos responsáveis`:'',r.length?`removeu ${r.join(', ')} dos responsáveis`:''].filter(Boolean).join(' e ')}
    case 'tags':{const a=v.filter(x=>!o.includes(x)).map(x=>tagById(x)?.name),r=o.filter(x=>!v.includes(x)).map(x=>tagById(x)?.name);return [a.length?`adicionou a tag ${a.join(', ')}`:'',r.length?`removeu a tag ${r.join(', ')}`:''].filter(Boolean).join(' e ')}
    case 'listId':return `moveu para a lista ${listById(v)?.name}`;
    case 'title':return `renomeou para “${v}”`;
    case 'desc':return 'atualizou a descrição';
    case 'estimate':return `definiu a estimativa em ${v}h`;
    case 'recur':return v?`tornou a tarefa recorrente (${v})`:'removeu a recorrência';
    case 'blockedBy':return 'atualizou as dependências';
    case 'link':return v?'atualizou o link':'removeu o link';
    case 'rev':return `registrou ${v} rodada${v===1?'':'s'} de revisão do cliente`;
    default:return `alterou ${f}`;
  }
}
function setField(t,f,v){
  const o=t[f];if(JSON.stringify(o)===JSON.stringify(v))return;
  const wasDone=f==='status'?!!spaceOf(t)?.statuses.find(s=>s.id===o)?.done:false;
  t[f]=v;t.updatedAt=Date.now();log(t,describe(f,o,v,t));
  if(f==='status'){
    const nowDone=isDone(t);
    if(nowDone&&!wasDone){t.completedAt=Date.now();if(t.recur)spawnRecurrence(t)}
    if(!nowDone)t.completedAt=null;
    t.assignees.forEach(m=>notify(m,`${who()} moveu “${t.title}” para ${statusOf(t).name}`,t.id));
    runAuto('status',t,statusOf(t).name);
  }
  if(f==='priority')runAuto('priority',t,v);
  if(f==='assignees')v.filter(x=>!o.includes(x)).forEach(m=>{notify(m,`${who()} atribuiu a você: “${t.title}”`,t.id);runAuto('assigned',t,m)});
  if(f==='tags')v.filter(x=>!o.includes(x)).forEach(x=>runAuto('tag',t,x));
}
function spawnRecurrence(t){
  const sp=spaceOf(t),m=t.recur==='mensal';const n=t.recur==='diaria'?1:7;
  const shift=s=>{if(!s)return'';if(m){const d=parse(s);d.setMonth(d.getMonth()+1);return iso(d)}return addDays(s,n)};
  const c=structuredClone(t);
  Object.assign(c,{id:uid(),status:sp.statuses.find(s=>!s.done)?.id||sp.statuses[0].id,start:shift(t.start),due:shift(t.due||TODAY),time:[],comments:[],activity:[],completedAt:null,createdAt:Date.now(),updatedAt:Date.now(),order:Date.now(),checklist:t.checklist.map(x=>({...x,id:uid(),done:false}))});
  c.activity.push({at:Date.now(),by:'auto',text:'criada pela recorrência da tarefa anterior'});
  S.tasks.push(c);t.recur='';
  toast(`Próxima ocorrência criada para ${fmtLong(c.due)}`);
}
function createTask(o){
  const listId=o.listId&&listById(o.listId)?o.listId:defaultList();
  if(!listId){toast('Crie uma lista antes de adicionar tarefas');return null}
  const sp=spaceById(listById(listId).spaceId);
  const t={id:uid(),listId,title:o.title||'Nova tarefa',desc:o.desc||'',status:o.status||sp.statuses[0].id,priority:o.priority||'normal',assignees:o.assignees||[],tags:o.tags||[],start:o.start||'',due:o.due||'',estimate:o.estimate||0,time:[],checklist:o.checklist||[],comments:[],activity:[],blockedBy:[],recur:'',parentId:o.parentId||null,createdAt:Date.now(),updatedAt:Date.now(),completedAt:null,order:o.order??Date.now()+Math.random(),by:S.me,link:o.link||'',rev:0};
  t.activity.push({at:Date.now(),by:S.me,text:'criou a tarefa'});
  S.tasks.push(t);
  if(isDone(t))t.completedAt=Date.now();
  if(!o.quiet)t.assignees.forEach(m=>notify(m,`${who()} atribuiu a você: “${t.title}”`,t.id));
  runAuto('created',t,'');
  t.tags.forEach(x=>runAuto('tag',t,x));
  return t;
}
function defaultList(){
  const L=U.loc;if(L.t==='list'&&listById(L.id))return L.id;
  if(L.t==='space'){const l=S.lists.find(x=>x.spaceId===L.id);if(l)return l.id}
  return S.lists[0]?.id;
}
function removeTask(id){
  const ids=new Set([id]);let grew=true;
  while(grew){grew=false;S.tasks.forEach(t=>{if(t.parentId&&ids.has(t.parentId)&&!ids.has(t.id)){ids.add(t.id);grew=true}})}
  S.tasks=S.tasks.filter(t=>!ids.has(t.id));
  S.tasks.forEach(t=>t.blockedBy=t.blockedBy.filter(b=>!ids.has(b)));
  if(S.timer&&ids.has(S.timer.taskId))S.timer=null;
}
function toggleDone(t){
  const sp=spaceOf(t);
  if(isDone(t)){setField(t,'status',sp.statuses.find(s=>!s.done)?.id||sp.statuses[0].id);return}
  const d=sp.statuses.find(s=>s.done);if(!d){toast('Este espaço não tem um status de conclusão');return}
  if(blocked(t))toast('Atenção: esta tarefa depende de outra que ainda não foi concluída');
  setField(t,'status',d.id);
}
function startTimer(id){stopTimer();S.timer={taskId:id,by:S.me,start:Date.now()};saveTimer()}
function stopTimer(){const tm=S.timer;if(!tm)return;const t=taskById(tm.taskId);const min=Math.max(1,Math.round((Date.now()-tm.start)/60000));if(t){t.time.push({by:tm.by,min,at:Date.now()});log(t,`registrou ${fmtMin(min)} de trabalho`)}S.timer=null;saveTimer()}

/* ============ automações ============ */
const TRIG={created:'Uma tarefa é criada',status:'O status muda para',priority:'A prioridade muda para',assigned:'Alguém é atribuído',tag:'A tag é adicionada'};
const ACT={assign:'Atribuir a',priority:'Definir prioridade',status:'Mover para o status',tag:'Adicionar a tag',due:'Definir prazo para daqui a',checkall:'Marcar todo o checklist como feito',comment:'Publicar comentário',notify:'Notificar'};
function allStatusNames(){const out=[];S.spaces.forEach(s=>s.statuses.forEach(x=>{if(!out.includes(x.name))out.push(x.name)}));return out}
function trigOptions(tr){
  if(tr==='status')return allStatusNames().map(n=>[n,n]);
  if(tr==='priority')return Object.entries(PRI).map(([k,v])=>[k,v.l]);
  if(tr==='assigned')return [['','qualquer pessoa'],...S.members.map(m=>[m.id,m.name])];
  if(tr==='tag')return S.tags.map(g=>[g.id,g.name]);
  return null;
}
function actOptions(a){
  if(a==='assign')return S.members.map(m=>[m.id,m.name]);
  if(a==='priority')return Object.entries(PRI).map(([k,v])=>[k,v.l]);
  if(a==='status')return allStatusNames().map(n=>[n,n]);
  if(a==='tag')return S.tags.map(g=>[g.id,g.name]);
  if(a==='due')return [1,2,3,5,7,14,30].map(n=>[String(n),`${n} dia${n>1?'s':''}`]);
  if(a==='notify')return [['assignees','os responsáveis'],...S.members.map(m=>[m.id,m.name])];
  return null;
}
const optLabel=(opts,v)=>opts?.find(o=>o[0]===v)?.[1]??v;
function runAuto(trig,t,val){
  if(DEPTH>3)return;DEPTH++;const prev=AUTO;
  for(const a of S.autos){
    if(!a.on||a.trigger!==trig)continue;
    if(a.scope&&spaceOf(t)?.id!==a.scope)continue;
    if(a.tv&&a.tv!==val)continue;
    AUTO=a.name;a.runs=(a.runs||0)+1;
    switch(a.action){
      case 'assign':if(!t.assignees.includes(a.av))setField(t,'assignees',[...t.assignees,a.av]);break;
      case 'priority':setField(t,'priority',a.av);break;
      case 'status':{const s=statusByName(spaceOf(t),a.av);if(s)setField(t,'status',s.id);break}
      case 'tag':if(!t.tags.includes(a.av))setField(t,'tags',[...t.tags,a.av]);break;
      case 'due':setField(t,'due',addDays(TODAY,+a.av||1));break;
      case 'checkall':if(t.checklist.some(c=>!c.done)){t.checklist.forEach(c=>c.done=true);log(t,'marcou todo o checklist como feito')}break;
      case 'comment':t.comments.push({id:uid(),by:'auto',text:a.av||'',at:Date.now()});break;
      case 'notify':(a.av==='assignees'?t.assignees:[a.av]).forEach(m=>notify(m,`Automação “${a.name}”: “${t.title}”`,t.id,true));break;
    }
  }
  AUTO=prev;DEPTH--;
}

/* ============ filtros e agrupamento ============ */
function locSpaces(){const L=U.loc;if(L.t==='space')return [spaceById(L.id)].filter(Boolean);if(L.t==='list'){const l=listById(L.id);return l?[spaceById(l.spaceId)]:[]}return S.spaces}
function filtered(ts){const q=U.q.trim().toLowerCase();return ts.filter(t=>(!q||t.title.toLowerCase().includes(q)||(t.desc||'').toLowerCase().includes(q))&&(!U.fm||t.assignees.includes(U.fm))&&(!U.fp||t.priority===U.fp)&&(!U.ft||t.tags.includes(U.ft))&&(!U.hideDone||!isDone(t)))}
function locTasks(){
  const L=U.loc;let ts;
  if(L.t==='my')ts=S.tasks.filter(t=>t.assignees.includes(S.me));
  else{ts=S.tasks.filter(t=>!t.parentId);if(L.t==='list')ts=ts.filter(t=>t.listId===L.id);else if(L.t==='space')ts=ts.filter(t=>listById(t.listId)?.spaceId===L.id)}
  return filtered(ts);
}
const sortT=ts=>[...ts].sort((a,b)=>a.order-b.order);
function statusCols(){const out=[];locSpaces().forEach(s=>s.statuses.forEach(st=>{if(!out.find(o=>o.name===st.name))out.push(st)}));return out}
function groups(ts){
  if(U.groupBy==='priority')return Object.keys(PRI).map(k=>({key:k,name:PRI[k].l,color:PRI[k].c,tasks:ts.filter(t=>t.priority===k)}));
  if(U.groupBy==='assignee')return [...S.members.map(m=>({key:m.id,name:m.name,color:m.color,tasks:ts.filter(t=>t.assignees.includes(m.id))})),{key:'none',name:'Sem responsável',color:'#8A94A0',tasks:ts.filter(t=>!t.assignees.length)}];
  return statusCols().map(c=>({key:c.name,name:c.name,color:c.color,tasks:ts.filter(t=>statusOf(t)?.name===c.name)}));
}
function moveToGroup(t,key){
  if(U.groupBy==='priority')return setField(t,'priority',key);
  if(U.groupBy==='assignee')return setField(t,'assignees',key==='none'?[]:t.assignees.includes(key)?t.assignees:[key]);
  const s=statusByName(spaceOf(t),key);
  if(!s){toast(`O espaço ${spaceOf(t)?.name} não tem o status “${key}”`);return}
  if(s.done&&blocked(t))toast('Atenção: esta tarefa depende de outra que ainda não foi concluída');
  setField(t,'status',s.id);
}
function groupDefaults(key){
  const o={};if(key==null)return o;
  if(U.groupBy==='priority')o.priority=key;
  else if(U.groupBy==='assignee'){if(key!=='none')o.assignees=[key]}
  else o.statusName=key;
  return o;
}

/* ============ cabeçalho ============ */
function elapsed(){if(!S.timer)return'';const s=Math.floor((Date.now()-S.timer.start)/1000);return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`}
function timerPill(){if(!S.timer)return'';const t=taskById(S.timer.taskId);if(!t)return'';return `<button class="timer-pill" data-a="open" data-id="${t.id}" title="Cronômetro rodando">${ic('clock')}<span data-tick>${elapsed()}</span><span class="tp-t">${esc(t.title)}</span></button><button class="icon-btn" data-a="stopTimer" title="Parar cronômetro" aria-label="Parar cronômetro">${ic('stop')}</button>`}
const topBar=(title,sub,right='')=>`<div class="top"><button class="icon-btn menu" data-a="side" aria-label="Abrir menu">${ic('menu')}</button><div class="top-t">${sub?`<small>${sub}</small>`:''}<h1>${title}</h1></div><div class="top-r">${timerPill()}${right}</div></div>`;

/* ============ área de trabalho ============ */
const VIEWS=[['board','Quadro','board'],['list','Lista','list'],['cal','Calendário','cal'],['load','Carga de trabalho','load']];
function workPage(){
  const L=U.loc;let title='Todas as tarefas',sub='Espaço de trabalho';
  if(L.t==='space'){title=spaceById(L.id).name;sub='Espaço'}
  if(L.t==='list'){const l=listById(L.id);title=l.name;sub=esc(spaceById(l.spaceId).name)}
  if(L.t==='my'){title='Minhas tarefas';sub=esc(mem(S.me).name)}
  const scope=L.t==='list'?S.tasks.filter(t=>t.listId===L.id&&!t.parentId):L.t==='space'?S.tasks.filter(t=>!t.parentId&&listById(t.listId)?.spaceId===L.id):null;
  if(scope&&scope.length){const p=Math.round(scope.filter(isDone).length/scope.length*100);sub+=` <span class="prog"><i><b style="width:${p}%"></b></i><span class="num">${p}% concluído</span></span>`}

  const fn={list:listView,board:boardView,cal:calView,gantt:ganttView,table:tableView,load:loadView}[U.view]||boardView;
  return topBar(esc(title),sub,`<button class="btn primary" data-a="newTask">${ic('plus')} Nova tarefa</button>`)+(L.t==='list'?jobStrip(listById(L.id)):'')+tabs+toolbar()+`<div class="view">${fn(ts)}</div>`;
}
function toolbar(){

    ${['list','board'].includes(U.view)?`<select id="gb" data-c="filt" data-k="groupBy" aria-label="Agrupar por"><option value="status" ${U.groupBy==='status'?'selected':''}>Agrupar por status</option><option value="priority" ${U.groupBy==='priority'?'selected':''}>Agrupar por prioridade</option><option value="assignee" ${U.groupBy==='assignee'?'selected':''}>Agrupar por responsável</option></select>`:''}

const emptyView=()=>`<div class="empty"><b>Nenhuma tarefa por aqui</b>Crie uma tarefa com o botão “Nova tarefa” ou tecla N. Se usou filtros, experimente limpá-los.</div>`;

/* --- quadro --- */

function boardView(ts){
  return `<div class="board scroll" data-keep="board">${groups(ts).map(g=>{const h=g.tasks.reduce((a,t)=>a+(+t.estimate||0),0);return `

      <div class="col-b">${sortT(g.tasks).map(cardHTML).join('')}</div>

    </div>`}).join('')}</div>`;
}
/* --- calendário --- */
function calView(ts){
  const [y,m]=U.month.split('-').map(Number),first=new Date(y,m-1,1),gs=addDays(iso(first),-first.getDay());
  const cells=[];for(let i=0;i<42;i++)cells.push(addDays(gs,i));
  const byDate={};ts.forEach(t=>{if(t.due)(byDate[t.due]=byDate[t.due]||[]).push(t)});
  const undated=ts.filter(t=>!t.due&&!isDone(t));
  const chip=t=>`<div class="cchip ${isDone(t)?'dn-t':''}" style="--c:${statusOf(t)?.color}" ${canEditTask(t)?'draggable="true" data-drag':''} data-a="open" data-id="${t.id}" title="${esc(t.title)}">${esc(t.title)}</div>`;
  return `<div class="calw"><div class="cal">
    <div class="cal-h"><button class="icon-btn" data-a="month" data-d="-1" aria-label="Mês anterior">${ic('left')}</button><h2>${MESL[m-1]} ${y}</h2><button class="icon-btn" data-a="month" data-d="1" aria-label="Próximo mês">${ic('chev')}</button><button class="btn sm" data-a="month" data-d="0">Hoje</button><span class="muted" style="margin-left:auto;font-size:12.5px">Arraste tarefas entre os dias para mudar o prazo</span></div>
    <div class="cal-g scroll">${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    ${cells.map(d=>`<div class="cday ${d.slice(0,7)!==U.month?'out':''} ${d===TODAY?'td':''}" data-dropdate="${d}">
      <div class="cday-h"><span class="dn">${parse(d).getDate()}</span><button class="icon-btn sm addd" data-a="newTask" data-due="${d}" aria-label="Nova tarefa em ${fmtLong(d)}">${ic('plus')}</button></div>
      <div class="cchips">${sortT(byDate[d]||[]).map(chip).join('')}</div></div>`).join('')}</div>
  </div>
  <div class="tray" data-dropdate=""><h3>Sem prazo</h3><p>Arraste para um dia para agendar.</p>${undated.map(chip).join('')||'<p>Todas as tarefas têm prazo.</p>'}</div></div>`;
}
/* --- gantt --- */
const DW=34,GD=42;
function ganttView(ts){
  const s0=U.gStart,days=[];for(let i=0;i<GD;i++)days.push(addDays(s0,i));
  const rows=ts.filter(t=>t.start||t.due).sort((a,b)=>(a.start||a.due).localeCompare(b.start||b.due));
  const none=ts.filter(t=>!t.start&&!t.due);
  const we=d=>[0,6].includes(parse(d).getDay());
  const bar=t=>{
    const s=t.start||t.due,e=(t.due&&t.due>=s)?t.due:s;
    let a=diffDays(s0,s),b=diffDays(s0,e);if(b<0||a>=GD)return'';
    const l=Math.max(0,a),r=Math.min(GD-1,b),p=t.checklist.length?t.checklist.filter(c=>c.done).length/t.checklist.length*100:(isDone(t)?100:0);
    return `<div class="bar ${isDone(t)?'done':''} ${isLate(t)?'late':''}" ${canEditTask(t)?`data-gbar="${t.id}"`:`data-a="open" data-id="${t.id}"`} style="--c:${statusOf(t)?.color};left:${l*DW+2}px;width:${(r-l+1)*DW-4}px" title="${esc(t.title)} · ${fmtLong(s)} → ${fmtLong(e)}"><i class="pf" style="width:${p}%"></i><span>${esc(t.title)}</span><i class="h"></i></div>`;
  };
  return `<div class="g-ctl"><button class="icon-btn" data-a="gshift" data-d="-7" aria-label="Semana anterior">${ic('left')}</button><button class="btn sm" data-a="gshift" data-d="0">Hoje</button><button class="icon-btn" data-a="gshift" data-d="7" aria-label="Próxima semana">${ic('chev')}</button><span class="muted" style="font-size:12.5px">${fmtLong(days[0])} – ${fmtLong(days[GD-1])} · arraste a barra para mover, a borda direita para mudar o prazo</span></div>
  <div class="gw scroll" data-keep="gantt"><div class="g" style="--dw:${DW}px;width:${230+GD*DW}px">
    <div class="g-head"><div class="g-name">Tarefa</div><div class="g-days">${days.map(d=>{const x=parse(d);return `<div class="g-day ${we(d)?'we':''} ${d===TODAY?'td':''} ${x.getDate()===1?'m1':''}">${x.getDate()===1||d===days[0]?MES[x.getMonth()]:DOW[x.getDay()][0]}<b>${x.getDate()}</b></div>`}).join('')}</div></div>
    <div style="position:relative">
      <div class="g-grid" style="left:230px">${days.map(d=>`<span class="${we(d)?'we':''} ${d===TODAY?'td':''}"></span>`).join('')}</div>
      ${rows.map(t=>`<div class="g-row"><div class="g-name" data-a="open" data-id="${t.id}"><span class="sdot" style="background:${statusOf(t)?.color}"></span><span>${esc(t.title)}</span>${blocked(t)?ic('lock','sm'):''}</div><div class="g-track" style="width:${GD*DW}px">${bar(t)}</div></div>`).join('')}
      ${none.length?`<div class="g-row"><div class="g-name muted" style="font-size:12px">Sem datas: ${none.length} tarefa${none.length>1?'s':''}</div><div class="g-track" style="width:${GD*DW}px;display:flex;align-items:center;gap:6px;padding-left:8px">${none.slice(0,8).map(t=>`<button class="dchip" data-a="open" data-id="${t.id}"><span>${esc(t.title)}</span></button>`).join('')}</div></div>`:''}
    </div>
  </div></div>`;
}
/* --- tabela --- */
const TCOLS=[['title','Tarefa'],['status','Status'],['assignees','Responsáveis'],['priority','Prioridade'],['start','Início'],['due','Prazo'],['estimate','Estimativa'],['time','Tempo gasto'],['list','Lista'],['tags','Tags']];
function tableView(ts){
  const k=U.sort.k,d=U.sort.d;
  const val=t=>({title:t.title.toLowerCase(),status:statusOf(t)?.name,assignees:mem(t.assignees[0])?.name||'~',priority:PRI_ORDER[t.priority],start:t.start||'9999',due:t.due||'9999',estimate:+t.estimate||0,time:spent(t),list:listById(t.listId)?.name,tags:tagById(t.tags[0])?.name||'~'}[k]);
  const sorted=[...ts].sort((a,b)=>{const x=val(a),y=val(b);return (x>y?1:x<y?-1:0)*d});
  return `<div class="tblw scroll" data-keep="table">${ts.length?`<table class="tt"><thead><tr>${TCOLS.map(([c,l])=>`<th data-a="sort" data-k="${c}">${l}${k===c?(d>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead><tbody>
  ${sorted.map(t=>{const sp=spaceOf(t);return `<tr>
    <td class="tcell" data-a="open" data-id="${t.id}">${blocked(t)?ic('lock','sm')+' ':''}${esc(t.title)}</td>
    <td><select data-c="tf" data-f="status" data-id="${t.id}"${dis(t)} aria-label="Status">${sp.statuses.map(s=>`<option value="${s.id}" ${s.id===t.status?'selected':''}>${esc(s.name)}</option>`).join('')}</select></td>
    <td>${avs(t.assignees)}</td>
    <td><select data-c="tf" data-f="priority" data-id="${t.id}"${dis(t)} aria-label="Prioridade">${Object.entries(PRI).map(([p,v])=>`<option value="${p}" ${p===t.priority?'selected':''}>${v.l}</option>`).join('')}</select></td>
    <td><input type="date" value="${t.start}" data-c="tf" data-f="start" data-id="${t.id}"${dis(t)} aria-label="Início"></td>
    <td><input type="date" value="${t.due}" data-c="tf" data-f="due" data-id="${t.id}"${dis(t)} aria-label="Prazo" ${isLate(t)?'style="color:var(--danger);font-weight:600"':''}></td>
    <td class="num">${t.estimate?t.estimate+'h':'–'}</td>
    <td class="num">${spent(t)?fmtMin(spent(t)):'–'}</td>
    <td><span class="crumb">${esc(sp.name)} · ${esc(listById(t.listId)?.name)}</span></td>
    <td><div class="tags">${tagChips(t)}</div></td></tr>`}).join('')}
  </tbody></table>`:emptyView()}</div>`;
}
/* --- carga de trabalho --- */
function loadView(ts){
  const mon=addDays(TODAY,-((parse(TODAY).getDay()+6)%7));
  const weeks=[0,1,2,3].map(i=>addDays(mon,i*7));
  const open=ts.filter(t=>!isDone(t));
  const hrs=t=>(+t.estimate||0)/(t.assignees.length||1);
  const cell=(list,cap)=>{const h=Math.round(list.reduce((a,t)=>a+hrs(t),0)*10)/10,r=cap?h/cap:0,c=r>1?'var(--danger)':r>.8?'var(--warn)':'var(--ok)';
    return `<div class="ld-c"><span class="hrs">${h}h${cap?` / ${cap}h`:''}</span> <span class="muted" style="font-size:12px">· ${list.length} tarefa${list.length===1?'':'s'}</span>${cap?`<div class="meter"><i style="width:${Math.min(100,r*100)}%;background:${c}"></i></div>`:'<div style="height:8px"></div>'}${list.slice(0,3).map(t=>`<button class="lk" data-a="open" data-id="${t.id}">${esc(t.title)}</button>`).join('')}${list.length>3?`<span class="muted" style="font-size:11.5px">+${list.length-3} mais</span>`:''}</div>`};
  const people=S.members.filter(m=>!U.fFn||m.funcao===U.fFn);
  return `<div class="lw scroll" data-keep="load"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px"><select data-c="filt" data-k="fFn" aria-label="Função"><option value="">Todas as funções</option>${FUNCS.map(([k,l])=>`<option value="${k}" ${U.fFn===k?'selected':''}>${l}</option>`).join('')}</select></div><p class="muted" style="margin:0 0 10px;font-size:13px">Horas estimadas das tarefas em aberto por semana de prazo, comparadas à capacidade semanal de cada pessoa. Tarefas com mais de um responsável dividem as horas.</p>
  <div class="ld-t"><div class="lh">Pessoa</div><div class="lh" style="color:var(--danger)">Atrasadas</div>${weeks.map((w,i)=>`<div class="lh">${i===0?'Esta semana':'Semana de '+fmtDate(w)}</div>`).join('')}
  ${people.map(m=>{const mine=open.filter(t=>t.assignees.includes(m.id));return `<div class="ld-m">${av(m.id)}<span><b>${esc(m.name)}</b><small>${fnName(m.funcao)||'Sem função'} · ${m.cap||40}h/sem</small></span></div>
    ${cell(mine.filter(t=>t.due&&t.due<TODAY))}
    ${weeks.map((w,i)=>cell(mine.filter(t=>t.due&&t.due>=(i===0?TODAY:w)&&t.due<=addDays(w,6)),m.cap||40)).join('')}`}).join('')}
  </div></div>`;
}

/* ============ páginas ============ */
function miniRow(t){return `<div class="mini" data-a="open" data-id="${t.id}"><button class="chk ${isDone(t)?'on':''}" data-a="toggleDone" data-id="${t.id}" aria-label="Concluir">${ic('check')}</button><span class="sdot" style="background:${statusOf(t)?.color}"></span><span class="mt ${isDone(t)?'done-t':''}">${esc(t.title)}</span><span class="crumb">${esc(listById(t.listId)?.name)}</span>${priChip(t.priority,true)}${dueChip(t)}</div>`}
function activityFeed(limit,filter){
  const items=[];S.tasks.forEach(t=>{if(filter&&!filter(t))return;t.activity.forEach(a=>items.push({...a,t,k:'a'}));t.comments.forEach(c=>items.push({...c,t,k:'c'}))});
  items.sort((a,b)=>b.at-a.at);
  return items.slice(0,limit).map(i=>`<div class="act">${av(i.by)}<p><b>${i.by==='auto'?'Automação':esc(mem(i.by)?.name||'Alguém')}</b> ${i.k==='c'?'comentou em':esc(i.text)+' ·'} <span class="tl" data-a="open" data-id="${i.t.id}">${esc(i.t.title)}</span>${i.k==='c'?`: “${esc(i.text.slice(0,90))}”`:''}<small>${ago(i.at)}</small></p></div>`).join('')||'<p class="muted">Nada por aqui ainda.</p>';
}
function homePage(){

const txEff=(t,id)=>{const v=+t.amount||0;if(t.kind==='tr')return (t.accountId===id?-v:0)+(t.toAccountId===id?v:0);return t.accountId===id?(t.kind==='in'?v:-v):0};

const accBalAt=(a,day)=>(+a.initial||0)+S.ftx.reduce((s0,t)=>t.paid&&(t.paidDate||t.date)<=day?s0+txEff(t,a.id):s0,0);

function invMonthOf(card,date){const d=parse(date),close=+card.closeDay||25;let m=d.getMonth()+(d.getDate()>close?1:0);if((+card.dueDay||5)<=close)m++;const x=new Date(d.getFullYear(),m,1);return x.getFullYear()+'-'+pad(x.getMonth()+1)}
const invDue=(card,ym)=>{const last=new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();return ym+'-'+pad(Math.min(+card.dueDay||5,last))};
function invoiceOf(card,ym){
  const items=S.ftx.filter(t=>t.kind==='out'&&t.accountId===card.id&&invMonthOf(card,t.date)===ym).sort((x,y)=>x.date.localeCompare(y.date));
  const total=ftSum(items,'out'),paid=S.ftx.filter(t=>t.kind==='tr'&&t.toAccountId===card.id&&t.invoice===ym&&t.paid).reduce((s0,t)=>s0+(+t.amount||0),0);
  return {ym,items,total,paid,open:Math.max(0,round2(total-paid)),due:invDue(card,ym)};
}
function openInvoices(card){const yms=new Set(S.ftx.filter(t=>t.kind==='out'&&t.accountId===card.id).map(t=>invMonthOf(card,t.date)));return [...yms].sort().map(ym=>invoiceOf(card,ym)).filter(iv=>iv.open>0.004)}
const invLate=()=>cardAccs().flatMap(c=>openInvoices(c).filter(iv=>iv.due<TODAY).map(iv=>({c,iv})));

/* saldo previsto numa data: realizado até hoje + pendentes vencendo até lá − faturas de cartão que esta conta paga */
function accForecast(a,day){
  if(day<TODAY)return accBalAt(a,day);
  let v=accBalance(a);
  S.ftx.forEach(t=>{if(!t.paid&&t.date<=day)v+=txEff(t,a.id)});
  if(!isCard(a))cardAccs().filter(c=>payAccOf(c)===a.id).forEach(c=>openInvoices(c).forEach(iv=>{if(iv.due<=day)v-=iv.open}));

function loadXLSX(){

const impNorm=x=>String(x??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
function impDate(v){
  if(v instanceof Date)return iso(v);
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}
  const t=String(v||'').trim(),m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/)||t.match(/^(\d{4})-(\d{2})-(\d{2})/);

function impNum(v){if(typeof v==='number')return v;let t=String(v??'').replace(/[R$\s]/g,'');if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');return parseFloat(t)||0}
function parseMobills(wb){
  const X=window.XLSX,sheets=wb.SheetNames.map(n=>({n:impNorm(n),rows:X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null})}));
  const hdr=sh=>(sh.rows[0]||[]).map(impNorm),col=(h,...names)=>h.findIndex(x=>names.includes(x));
  const isTx=sh=>{const h=hdr(sh);return h.includes('data')&&h.includes('valor')&&h.includes('conta')};
  const isTr=sh=>{const h=hdr(sh);return h.includes('conta origem')&&h.includes('conta destino')};
  let main=sheets.filter(sh=>sh.n==='receitas e despesas'&&isTx(sh));
  if(!main.length)main=sheets.filter(sh=>(sh.n==='receitas'||sh.n==='despesas')&&isTx(sh));

  const key=(...a)=>{const k=a.join('|');seen[k]=(seen[k]||0)+1;return k+'#'+seen[k]};
  main.forEach(sh=>{const h=hdr(sh),iD=col(h,'data'),iDs=col(h,'descricao'),iV=col(h,'valor'),iA=col(h,'conta'),iS=col(h,'situacao'),iC=col(h,'categoria'),iSc=col(h,'subcategoria'),iT=col(h,'tipo');

      if(iT>=0&&/despesa/.test(impNorm(r[iT]))&&v>0)v=-v;

      const cat=String(r[iC]??'').trim()+(iSc>=0&&r[iSc]?' / '+String(r[iSc]).trim():'');

    sh.rows.slice(1).forEach(r=>{const date=impDate(r[iD]),amount=round2(Math.abs(impNum(r[iV])));if(!date||!amount||!r[iF]||!r[iTo])return;
      const from=String(r[iF]).trim(),to=String(r[iTo]).trim();tr.push({date,from,to,amount,desc:iDs>=0&&r[iDs]?String(r[iDs]).trim():'Transferência',imp:'mobtr:'+key(date,impNorm(from),impNorm(to),amount)})})});

}
async function impFile(file){

function resChip(kind,id){

}
function resPicker(kind,sel){

function resSection(kind,sel){

function resSync(f,kind){

function importJSON(txt){
  try{const d=JSON.parse(txt);if(!d||!Array.isArray(d.tasks)||!Array.isArray(d.spaces))throw 0;
    confirmBox('Importar backup?',`${d.tasks.length} tarefas e ${d.spaces.length} espaços vão substituir os dados atuais.`,()=>{COLS.forEach(c=>S[c]=Array.isArray(d[c])?d[c]:[]);U.task=null;U.loc={t:'all'};toast('Backup importado')},'Importar')}
  catch(e){toast('Esse texto não é um backup válido do MEGA Gestão')}
}
