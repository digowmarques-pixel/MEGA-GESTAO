    g.targets.push({id:uid(),name:f.querySelector('#nr-name').value.trim(),type,current:0,target:type==='done'?1:(parseFloat(f.querySelector('#nr-target').value)||1),unit:f.querySelector('#nr-unit').value,listId:f.querySelector('#nr-list').value});closeModal();render()},
};

/* ============ eventos ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const field=e.target.closest('select,input,textarea,label');
  if(field&&!field.matches('[data-a]')&&el.contains(field))return;
  A[el.dataset.a]?.(el,e);
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el)C[el.dataset.c]?.(el,e)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-i]');if(el)I[el.dataset.i]?.(el,e)});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const b=f.querySelector('[type=submit]');if(b)b.disabled=true;Promise.resolve(F[f.dataset.form]?.(f)).finally(()=>{if(b&&b.isConnected)b.disabled=false})});
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender&&!isTyping()){pendingRender=false;render()}},0));
document.getElementById('modal').addEventListener('mousedown',e=>{if(e.target.id==='modal'&&!MLOCK)closeModal()});
document.addEventListener('keydown',e=>{
  const tg=e.target,typing=tg.matches('input,textarea,select,[contenteditable]');
  if(e.key==='Enter'&&tg.dataset.enter&&!e.shiftKey&&!e.isComposing){e.preventDefault();E[tg.dataset.enter]?.(tg);return}
  if(e.key==='Enter'&&tg.id==='chat-input'&&!e.shiftKey&&!e.isComposing){e.preventDefault();A.chatSend();return}
  if(e.key==='Enter'&&tg.id==='cmt'&&(e.ctrlKey||e.metaKey)){e.preventDefault();document.querySelector('[data-a="comment"]')?.click();return}
  if(tg.id==='palq'){const items=[...document.querySelectorAll('.pr')];let i=items.findIndex(x=>x.classList.contains('sel'));
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();items[i]?.classList.remove('sel');i=(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items[i]?.classList.add('sel');items[i]?.scrollIntoView({block:'nearest'});return}
    if(e.key==='Enter'){e.preventDefault();palGo(PAL[Math.max(0,i)]);return}}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();A.palette();return}
  if(!ME)return;
  if(e.key==='Escape'){if(!document.getElementById('modal').hidden){if(!MLOCK)closeModal()}else if(U.task){if(typing)tg.blur();U.task=null;render()}else if(U.side)A.side();return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey||!document.getElementById('modal').hidden)return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();if(can('criar_tarefas'))newTaskModal();else toast('Você não tem permissão para criar tarefas')}
  else if(e.key==='/'&&U.page==='work'){e.preventDefault();document.getElementById('q')?.focus()}
  else if(U.page==='work'&&!U.task&&VIEWS[+e.key-1]){U.view=VIEWS[+e.key-1][0];render()}
});
/* arrastar e soltar (quadro e calendário) */
let DRAG=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('[data-drag]');if(!c)return;DRAG=c.dataset.id;e.dataTransfer.setData('text/plain',DRAG);e.dataTransfer.effectAllowed='move';requestAnimationFrame(()=>c.classList.add('dragging'))});
document.addEventListener('dragend',()=>{document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'));DRAG=null});
document.addEventListener('dragover',e=>{if(!DRAG)return;const z=e.target.closest('[data-drop],[data-dropdate]');if(!z)return;e.preventDefault();document.querySelectorAll('.over').forEach(x=>x!==z&&x.classList.remove('over'));z.classList.add('over')});
document.addEventListener('drop',e=>{
  if(!DRAG)return;const z=e.target.closest('[data-drop],[data-dropdate]');if(!z)return;e.preventDefault();
  const t=taskById(DRAG);if(!t||!guard(t))return;
  if(z.dataset.dropdate!==undefined){const d=z.dataset.dropdate;if(d&&t.start&&t.start>d)t.start=d;setField(t,'due',d)}
  else{
    moveToGroup(t,z.dataset.drop);
    const cards=[...z.querySelectorAll('.card')].filter(c=>c.dataset.id!==t.id).map(c=>taskById(c.dataset.id));
    const tgt=e.target.closest('.card');
    if(tgt&&tgt.dataset.id!==t.id){const bt=taskById(tgt.dataset.id),i=cards.indexOf(bt),prev=cards[i-1];t.order=prev?(prev.order+bt.order)/2:bt.order-1}
    else if(!tgt&&cards.length)t.order=Math.max(...cards.map(c=>c.order))+1;
  }
  DRAG=null;commit();
});
/* projetos: arrastar entre etapas */
let JDRAG=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('[data-jdrag]');if(!c)return;JDRAG=c.dataset.id;e.dataTransfer.setData('text/plain',JDRAG);e.dataTransfer.effectAllowed='move';requestAnimationFrame(()=>c.classList.add('dragging'))});
document.addEventListener('dragend',()=>{JDRAG=null});
document.addEventListener('dragover',e=>{if(!JDRAG)return;const z=e.target.closest('[data-jdrop]');if(!z)return;e.preventDefault();document.querySelectorAll('.over').forEach(x=>x!==z&&x.classList.remove('over'));z.classList.add('over')});
document.addEventListener('drop',e=>{if(!JDRAG)return;const z=e.target.closest('[data-jdrop]');if(!z)return;e.preventDefault();const l=listById(JDRAG);JDRAG=null;if(!l)return;l.stage=z.dataset.jdrop;toast(`“${l.name}” agora está em ${stageOf(l)[1]}`);commit()});
/* gantt: mover e redimensionar barras */
let G=null;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-gbar]');if(!b||e.button!==0)return;e.preventDefault();G={el:b,id:b.dataset.gbar,x:e.clientX,mode:e.target.classList.contains('h')?'end':'move',l:b.offsetLeft,w:b.offsetWidth,moved:false};b.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!G)return;const dx=e.clientX-G.x;if(Math.abs(dx)>3)G.moved=true;if(G.mode==='move')G.el.style.left=G.l+dx+'px';else G.el.style.width=Math.max(DW-4,G.w+dx)+'px'});
document.addEventListener('pointerup',e=>{if(!G)return;const g=G;G=null;const t=taskById(g.id);
  if(!g.moved){U.task=g.id;render();return}
  const d=Math.round((e.clientX-g.x)/DW);if(!d){render();return}
  if(g.mode==='move'){const s=t.start,u=t.due;if(s)setField(t,'start',addDays(s,d));if(u)setField(t,'due',addDays(u,d))}
  else{const base=t.due||t.start;let nd=addDays(base,d);if(t.start&&nd<t.start)nd=t.start;setField(t,'due',nd)}
  commit()});
/* relógio do cronômetro */
setInterval(()=>{if(!S.timer)return;const v=elapsed();document.querySelectorAll('[data-tick]').forEach(x=>x.textContent=v)},1000);

applyTheme();
(async()=>{
  const me=await detectMode();
  if(MODE==='remote'&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(me.offline)showAuth('login','Sem conexão com a internet. Verifique a rede e recarregue a página.');
  else if(me.setup)showAuth('setup');else if(me.user)enter(me.user);else showAuth('login');
})();
setInterval(()=>{if(ME&&MODE==='remote'&&!document.hidden)sync(true)},6000);

let chatTick=0;
setInterval(()=>{if(!ME||document.hidden)return;chatTick++;if(U.page==='chat'||chatTick%3===0)chatPoll()},2500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ME)chatPoll()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ME&&MODE==='remote')sync(true)});
